      <path d="M153.33,42.41 L73.33,88.60"/>
      <path d="M73.33,27.02 L153.33,73.21"/>
      <path d="M46.67,42.41 L126.67,88.60"/>
    </g>

    <!-- Left face (F) - solved green -->
    <path d="M20,57.81 L100,104 L100,196.38 L20,150.19 Z" fill="#009a44" stroke="#12152a" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#12152a" stroke-opacity="0.28" stroke-width="1.6" stroke-linecap="round">

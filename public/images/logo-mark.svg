    <path d="M100,176.0 L122,163.3 L122,183.3 L100,196.0 Z" fill="#232b5c"/>
    <!-- 3rd place (right) -->
    <path d="M144,168.6 L166,181.3 L144,194.0 L122,181.3 Z" fill="#5b7cff"/>
    <path d="M122,181.3 L144,194.0 L144,196.0 L122,183.3 Z" fill="#2c3570"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="OBD Cube logo mark">
  <title>OBD Cube</title>

  <!-- Cube: authentic scrambled colors = the cube's own identity -->

      <path d="M100,134.79 L180,88.60"/>
      <path d="M100,165.59 L180,119.40"/>
    </g>
  </g>

  <!-- Podium: the competition platform's own identity, in brand blue -->
  <g stroke="#12152a" stroke-width="2.5" stroke-linejoin="round">
    <!-- 2nd place (left) -->
    <path d="M56,160.6 L78,173.3 L56,186.0 L34,173.3 Z" fill="#5b7cff"/>
